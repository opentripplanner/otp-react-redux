      description: >
        உங்கள் பயணத் திட்டத்தைக் கண்டறிவதில் பலமுறை தோல்வியுற்ற பிறகு, பயணத்திட்டத்தில்
        ஒன்று அல்லது அதற்கு மேற்பட்ட மாற்றங்கள் ஏற்பட்டிருக்கலாம் என்பதால் கண்காணிப்பு
        இன்றைக்கு உறக்கநிலையில் வைக்கப்பட்டுள்ளது. பயணக் கண்காணிப்பை மீண்டும் தொடங்க,
        உறக்கநிலையை நீக்கு என்பதைக் சொடுக்கு செய்யவும். கண்காணிப்பு இன்னும் கிடைக்கவில்லை
        என்றால், கண்காணிக்க புதிய பயணத்தைத் திட்டமிடு என்பதைக் சொடுக்கு செய்யவும்.
