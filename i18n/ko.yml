    reportEmailTemplate: |
      *** 사용자 안내 ***
       이 기능을 사용하면 사이트 관리자에게 검토할 수 있도록 보고서를 이메일로 전송할 수 있습니다.
       아래 프롬프트를 작성한 후, 귀하의 일반 이메일 프로그램을 사용하여 전송하여 주십시오.
       
       *** 다음을 작성해 주십시오 ***
       
       발생한 문제:
       
